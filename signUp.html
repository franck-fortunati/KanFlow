<!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/style.css">
        <script src="assets/js/sign.js" defer></script>
        <title>KanFlow - Inscription</title>
    </head>
    <body>
        <main class="inscription">
            <div class="signUp">
                <div class="imgSign">
                    <img src="assets/img/Logo KanFlow.png">
                </div>
                <form id="signUp">
                    <label for="mail">E-mail</label>
                    <input type="email" name="mail" id="mail" placeholder="exemple@gmail.com">
                    <label for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" placeholder="votre mot de passe">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Les mots de passes doivent être identique">
                    <button id="inscription">Inscription</button>
                    <a href="signIn.html">Connexion</a>
                </form>
            </div>
        </main>
    </body>
    </html>
